let quizData = [];
let userAnswers = {};

function initializeQuiz() {
    quizData = rawQuizData.map(q => {
        // استخراج النص الأصلي للخيار الصحيح بناءً على الحرف الأصلي الممرر (A, B, C, D)
        let originalCorrectIndex = q.answer.charCodeAt(0) - 65;
        let cleanOpts = q.options.map(opt => opt.replace(/^[A-D]\.\s*/, ''));
        let correctText = cleanOpts[originalCorrectIndex];

        // خوارزمية الخلط الحقيقي Fisher-Yates Shuffle
        let shuffledOpts = [...cleanOpts];
        for (let i = shuffledOpts.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [shuffledOpts[i], shuffledOpts[j]] = [shuffledOpts[j], shuffledOpts[i]];
        }

        // تحديد الحرف الجديد للخيار الصحيح بعد الخلط العشوائي
        let newAnswerLetter = '';
        let formattedOpts = shuffledOpts.map((text, idx) => {
            let letter = String.fromCharCode(65 + idx);
            if (text === correctText) {
                newAnswerLetter = letter;
            }
            return `${letter}. ${text}`;
        });

        return {
            ...q,
            options: formattedOpts,
            answer: newAnswerLetter
        };
    });
}

function renderQuiz() {
    const container = document.getElementById("questions-container");
    container.innerHTML = "";

    quizData.forEach((q, index) => {
        let card = document.createElement("div");
        card.className = "question-card";
        card.id = `q-card-${index}`;

        let optionsHtml = "";
        q.options.forEach((opt, optIdx) => {
            let optLetter = String.fromCharCode(65 + optIdx);
            optionsHtml += `
                <label class="option-item" id="opt-${index}-${optLetter}">
                    <input type="radio" name="question-${index}" value="${optLetter}" onchange="trackAnswer(${index}, '${optLetter}')">
                    <span class="option-label">${opt}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="q-number">${index + 1}</div>
                    <span class="q-type">${q.type}</span>
                </div>
                <div id="pill-${index}" class="score-pill"></div>
            </div>
            <div class="question-text">${q.question}</div>
            <div class="options-list">
                ${optionsHtml}
            </div>
        `;
        container.appendChild(card);
    });
}

function trackAnswer(qIndex, selectedOption) {
    userAnswers[qIndex] = selectedOption;
    updateProgress();
}

function updateProgress() {
    const answeredCount = Object.keys(userAnswers).length;
    const remainingCount = quizData.length - answeredCount;
    
    document.getElementById("answered-count").textContent = `Answered: ${answeredCount} / ${quizData.length}`;
    document.getElementById("remaining-count").textContent = `Remaining: ${remainingCount}`;
    
    const percentage = Math.round((answeredCount / quizData.length) * 100);
    document.getElementById("progress-bar").style.width = `${percentage}%`;
}

function submitQuiz() {
    let score = 0;

    quizData.forEach((q, index) => {
        const userAns = userAnswers[index];
        const card = document.getElementById(`q-card-${index}`);
        const pill = document.getElementById(`pill-${index}`);
        
        card.classList.add("submitted");
        pill.style.display = "inline-block";

        if (userAns === q.answer) {
            score++;
            pill.textContent = "1 / 1";
            pill.className = "score-pill correct";
            if (userAns) {
                document.getElementById(`opt-${index}-${userAns}`).classList.add("selected-correct");
            }
        } else {
            pill.textContent = "0 / 1";
            pill.className = "score-pill incorrect";
            if (userAns) {
                document.getElementById(`opt-${index}-${userAns}`).classList.add("selected-wrong");
            }
            document.getElementById(`opt-${index}-${q.answer}`).classList.add("is-answer");
        }
    });

    document.getElementById("results-summary").style.display = "block";
    document.getElementById("final-score-badge").textContent = `${score} / ${quizData.length}`;
    
    const headerBadge = document.getElementById("header-score");
    headerBadge.style.display = "block";
    headerBadge.textContent = `${score} / ${quizData.length}`;

    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById("submit-btn").style.display = "none";
}

function resetQuiz() {
    userAnswers = {};
    document.getElementById("results-summary").style.display = "none";
    document.getElementById("header-score").style.display = "none";
    document.getElementById("submit-btn").style.display = "inline-block";
    initializeQuiz();
    renderQuiz();
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = function() {
    initializeQuiz();
    renderQuiz();
    updateProgress();
};
